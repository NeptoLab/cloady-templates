services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest
    environment:
      TZ: UTC/Chicago
      PGID: "1000"
      PUID: "1000"
    ports:
      - 3579
    volumes:
      - config:/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 2Gi
