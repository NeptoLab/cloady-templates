services:
  money-balancer:
    image: ghcr.io/dorianim/money-balancer
    environment:
      JWT_SECRET: ThisIsAVerySecretString
    ports:
      - 8000
    volumes:
      - data:/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
