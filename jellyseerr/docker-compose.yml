services:
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    environment:
      TZ: ${TZ}
      LOG_LEVEL: debug
    ports:
      - 5055
    volumes:
      - jellyseerr-config:/app/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  jellyseerr-config:
    driver_opts:
      size: 2Gi
