services:
  pingvin-share:
    image: stonith404/pingvin-share:v1.13.0
    ports:
      - 3000
    volumes:
      - data:/opt/app/backend/data
      - images:/opt/app/frontend/public/img
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  images:
    driver_opts:
      size: 2Gi
