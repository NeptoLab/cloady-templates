services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    environment:
      TZ: Europe/Berlin
      PGID: "1000"
      PUID: "1000"
    ports:
      - 80
      - 443
      - 81
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  letsencrypt:
    driver_opts:
      size: 2Gi
