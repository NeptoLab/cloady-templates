services:
  scratchmap:
    image: ad3m3r5/scratch-map:latest
    environment:
      PORT: "8080"
      DBLOCATION: /data
    ports:
      - 8080
    volumes:
      - scratch-map:/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  scratch-map:
    driver_opts:
      size: 2Gi
