services:
  flame:
    image: pawelmalak/flame
    environment:
      PASSWORD: MyStrongLoginPassword
    ports:
      - 5005
    volumes:
      - flame-data:/app/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  flame-data:
    driver_opts:
      size: 2Gi
