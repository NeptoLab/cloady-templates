services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
      JELLYFIN_PublishedServerUrl: ${APP_PROTOCOL}://${PUBLIC_HOST}/
    ports:
      - 8096
    volumes:
      - config:/config
      - data:/media/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 2Gi
