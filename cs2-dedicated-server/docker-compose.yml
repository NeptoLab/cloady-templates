services:
  cs2-server:
    image: joedwards32/cs2
    environment:
      TV_PW: changeme
      CS2_PW: sake-earthly-lair
      CS2_LAN: "0"
      TV_PORT: "27020"
      CS2_PORT: "27015"
      TV_DELAY: "0"
      TV_ENABLE: "0"
      CS2_CHEATS: "0"
      CS2_RCONPW: cruelly-sequel-dejected
      TV_MAXRATE: "0"
      SRCDS_TOKEN: <YOUR-GAME-SERVER-TOKEN>
      TV_RELAY_PW: changeme
      CS2_GAMEMODE: "1"
      CS2_GAMETYPE: "0"
      CS2_MAPGROUP: mg_active
      CS2_STARTMAP: de_dust2
      CS2_BOT_QUOTA: "0"
      CS2_GAMEALIAS: competitive
      TV_AUTORECORD: "0"
      CS2_MAXPLAYERS: "10"
      CS2_SERVERNAME: MY-CS2-SERVER
      CS2_BOT_DIFFICULTY: "0"
      CS2_BOT_QUOTA_MODE: competitive
      CS2_SERVER_HIBERNATE: "0"
    ports:
      - 27015
    volumes:
      - cs2:/home/steam/cs2-dedicated/
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  cs2-rconpanel:
    image: ghcr.io/l4rm4nd/cs2-rcon-panel:latest
    environment:
      PASSWORD: v67ic55x4ghvjfj
      USERNAME: cspanel
    expose:
      - 3000
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  cs2:
    driver_opts:
      size: 2Gi
