services:
  podfetch:
    image: samuel19982/podfetch:latest
    environment:
      PASSWORD: ${PODFETCH_PASSWORD}
      USERNAME: ${PODFETCH_USERNAME}
      BASIC_AUTH: "true"
      SERVER_URL: ${APP_PROTOCOL}://${PUBLIC_HOST}
      PODINDEX_API_KEY: '"${PODFETCH_PODINDEX_API_KEY}"'
      POLLING_INTERVAL: "60"
      PODINDEX_API_SECRET: '"${PODFETCH_PODINDEX_API_SECRET}"'
    ports:
      - 8000
    volumes:
      - podfetch-db:/app/db
      - podcasts:/app/podcasts
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  podcasts:
    driver_opts:
      size: 2Gi
  podfetch-db:
    driver_opts:
      size: 2Gi
