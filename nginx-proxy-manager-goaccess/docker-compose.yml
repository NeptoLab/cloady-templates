services:
  goaccess:
    image: xavierh/goaccess-for-nginxproxymanager:latest
    environment:
      TZ: Europe/Berlin
      PGID: "1000"
      PUID: "1000"
      BASIC_AUTH: "False"
      SKIP_ARCHIVED_LOGS: "False"
      BASIC_AUTH_PASSWORD: pass
      BASIC_AUTH_USERNAME: user
    ports:
      - 7880
    volumes:
      - logs:/opt/log:ro
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  logs:
    driver_opts:
      size: 2Gi
