services:
  gokapi:
    image: f0rc3/gokapi:latest
    ports:
      - 53842
    volumes:
      - data:/app/data
      - config:/app/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 2Gi
