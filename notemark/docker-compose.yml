services:
  notemark:
    image: ghcr.io/enchant97/note-mark-frontend:0.19.5
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
  notemark-proxy:
    image: nginx:alpine
    ports:
      - 80
    volumes:
      - nginx-conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
  notemark-backend:
    image: ghcr.io/enchant97/note-mark-backend:0.19.5
    environment:
      JWT_SECRET: ${NOTEMARK_SERVICE_SECRET}
      CORS_ORIGINS: "*"
    volumes:
      - data:/data
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  nginx-conf:
    driver_opts:
      size: 2Gi
