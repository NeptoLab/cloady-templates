services:
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    environment:
      TZ: '"Europe/Berlin"'
      PASSWORD: MySecureLoginPassword
    ports:
      - 7575
    volumes:
      - configs:/app/data/configs
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  configs:
    driver_opts:
      size: 2Gi
